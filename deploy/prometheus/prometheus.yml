global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Load alert rules (validated with `promtool check rules` in CI).
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: rate-limiter
    metrics_path: /actuator/prometheus
    # The service exposes Micrometer/Prometheus metrics at /actuator/prometheus.
    static_configs:
      - targets:
          - 'rate-limiter:8080'
