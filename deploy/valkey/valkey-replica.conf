bind 0.0.0.0
port 6379

# RATIONALE (ADR-0002): same AOF durability posture as the primary.
appendonly yes
appendfsync everysec

# RATIONALE: a replica is read-only; all writes go to the primary, which is what
# makes the Lua counter writes safe to replicate.
replica-read-only yes

# The primary is discovered via Sentinel, which rewrites this on failover. The
# initial value is a placeholder; Sentinel drives the real topology.
replicaof valkey-primary 6379
