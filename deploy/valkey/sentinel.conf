bind 0.0.0.0
port 26379

# RATIONALE: Sentinel monitors the master group 'ratelimiter'; quorum 2 of 3
# sentinels must agree before a failover is declared, so a single sentinel's
# outage can't trigger a spurious promotion. In the 3-sentinel compose topology
# each sentinel is configured identically; the master host is rewritten on
# failover. Each sentinel monitors the same master group.
sentinel monitor ratelimiter valkey-primary 6379 2
sentinel down-after-milliseconds ratelimiter 5000
sentinel failover-timeout ratelimiter 10000
sentinel parallel-syncs ratelimiter 1
