bind 0.0.0.0
port 6379

# RATIONALE (ADR-0002): AOF with appendfsync everysec. Accept up to ~1s of
# counter loss on host death; counters are ephemeral by nature (windows expire),
# and `always` would cost ~10x latency for no meaningful benefit.
appendonly yes
appendfsync everysec

# Allow replica to connect.
replica-read-only yes
