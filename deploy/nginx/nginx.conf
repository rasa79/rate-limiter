worker_processes auto;
events { worker_connections 1024; }

http {
    # TODO(review): upstream health checks are passive (max_fails/fail_timeout), not
    # the plan's active readiness-based /actuator/health/readiness probes — tracked
    # in KNOWN_LIMITATIONS.md
    # RATIONALE (ADR-0005): least_conn routes traffic to the instance with the
    # fewest active connections, avoiding a slow instance that is being drained. No
    # sticky sessions: the service is stateless (state lives in Valkey), so affinity
    # buys nothing and would hurt rebalancing.
    upstream rate_limiter_backend {
        least_conn;
        # Three stateless instances. The service exposes separate liveness/readiness
        # probes; open-source nginx performs passive health checks below (max_fails
        # + fail_timeout), and the active readiness-based rotation is provided by the
        # orchestrator (Kubernetes readiness probe in real deployments; the compose
        # environment relies on passive checks + autoheal for restarts).
        server rate-limiter-1:8080 max_fails=3 fail_timeout=10s;
        server rate-limiter-2:8080 max_fails=3 fail_timeout=10s;
        server rate-limiter-3:8080 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        location / {
            proxy_pass http://rate_limiter_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
