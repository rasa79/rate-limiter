# Base configuration for the rate-limiter service.
# Precedence (fixed across the project, documented in the README): file < env < admin API.
spring:
  application:
    name: rate-limiter-service
  # RATIONALE: high-concurrency, network-bound workload. Each HTTP request
  # blocks on a store round trip, so thread-per-request on virtual threads gives
  # the simplicity of blocking code without a reactive stack. Request handling
  # runs on the virtual-thread scheduler; non-blocking components are unaffected.
  threads:
    virtual:
      enabled: true

server:
  port: 8080

# Store selection: "in-memory" (default, used by unit/context tests and local dev)
# or "valkey" (the production backend). Override with RATE_LIMITER_STORE=valkey
# (env), which is how a deployment opts into Valkey. Precedence (documented in
# README): file < env < admin API.
ratelimiter:
  # Rule cache secondary freshness bound (seconds); pub/sub invalidation makes
  # changes immediate, this bound guarantees convergence if a message is lost.
  cache-ttl-seconds: 30
  rules:
    standard:
      name: standard
      algorithm: TOKEN_BUCKET
      limit: 100
      refillPerSecond: 10.0
    strict:
      name: strict
      algorithm: TOKEN_BUCKET
      limit: 5
      refillPerSecond: 1.0
    rolling-hour:
      name: rolling-hour
      algorithm: SLIDING_WINDOW
      limit: 100
      windowMillis: 3600000
    burst:
      name: burst
      algorithm: SLIDING_WINDOW
      limit: 5
      windowMillis: 1000
    free:
      name: free
      algorithm: TOKEN_BUCKET
      limit: 5
      refillPerSecond: 1.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # Expose the independent liveness / readiness probe groups:
      #   /actuator/health/liveness  -> JVM alive only
      #   /actuator/health/readiness -> able to serve traffic
      probes:
        enabled: true
      # RATIONALE: show-details=always lets a reviewer see the individual
      # component status (e.g. exactly which readiness contributor is DOWN),
      # which is what makes the readiness probe a diagnosable contract.
      show-details: always
      group:
        # Readiness = the process/VM state plus the 'valkey' contributor. The
        # valkey contributor is always registered: it checks Valkey reachability
        # + loaded scripts in valkey mode, and reports UP (not applicable) in
        # in-memory mode, so readiness here works in both.
        readiness:
          include: readinessState,valkey
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
