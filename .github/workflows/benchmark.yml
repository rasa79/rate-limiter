name: benchmark

# Weekly (and manual) benchmark evidence run. Not a gate — it just produces/records
# numbers. The k6 end-to-end leg needs the compose environment up, so it is a
# documented manual step (see docs/benchmarks.md); this job runs the JMH leg.
on:
  schedule:
    - cron: '0 4 * * 1'   # Monday 04:00 UTC
  workflow_dispatch: {}

jobs:
  jmh:
    name: JMH algorithm benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Make wrapper executable
        run: chmod +x mvnw
      - name: Run JMH benchmarks
        run: >-
          ./mvnw -B -ntp -pl service clean test-compile
          org.codehaus.mojo:exec-maven-plugin:3.5.0:java
          -Dexec.mainClass=org.openjdk.jmh.Main -Dexec.classpathScope=test
          -Dexec.args="com.ratelimiter.service.jmh.TokenBucketBenchmark com.ratelimiter.service.jmh.SlidingWindowBenchmark -f 0 -wi 5 -i 10"
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: jmh-results
          path: service/target/benchmark-results.txt
          if-no-files-found: warn
